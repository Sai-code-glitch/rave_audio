{% extends 'layout.html' %}
{% block title %}Request Listening Session | RAVE{% endblock %}

{% block content %}
<section style="padding: 120px 8%; max-width: 650px; margin: 0 auto;">
    <h1 style="font-family: 'Syne', sans-serif; font-size: 2.8rem; text-align: center; margin-bottom: 15px;">Private Audition Intake</h1>
    <p style="text-align: center; color: #8e8e93; margin-bottom: 50px;">Experience pure acoustic reproduction inside our laboratory reference studio environment.</p>
    
    <form action="/book" method="POST" style="background: #121214; padding: 40px; border: 1px solid #1c1c1f; border-radius: 8px;">
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #8e8e93;">Full Legal Name</label>
            <input type="text" name="name" required style="width: 100%; background: #0a0a0b; border: 1px solid #2c2c30; padding: 12px; border-radius: 4px; color: #fff; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #8e8e93;">Secure Email Address</label>
            <input type="email" name="email" required style="width: 100%; background: #0a0a0b; border: 1px solid #2c2c30; padding: 12px; border-radius: 4px; color: #fff; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #8e8e93;">Target Session Date</label>
            <input type="date" name="date" required style="width: 100%; background: #0a0a0b; border: 1px solid #2c2c30; padding: 12px; border-radius: 4px; color: #fff; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 35px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #8e8e93;">Acoustic System Requirements / Notes</label>
            <textarea name="notes" rows="4" style="width: 100%; background: #0a0a0b; border: 1px solid #2c2c30; padding: 12px; border-radius: 4px; color: #fff; font-size: 1rem; resize: none;"></textarea>
        </div>
        <button type="submit" style="width: 100%; background: #fff; color: #0a0a0b; font-weight: bold; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-size: 1rem;">Submit Security Verification</button>
    </form>
</section>
{% endblock %}
