{% extends 'layout.html' %}
{% block content %}
<section style="padding: 120px 8%; max-width: 650px; margin: 0 auto; position: relative; z-index: 5;">
    <h1 style="font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 800; text-align: center; margin-bottom: 15px;">Private Audition Intake</h1>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 50px;">Enter the laboratory coordinates to reserve a calibrated listening session.</p>
    <form action="/book" method="POST" class="glass-form">
        <div class="form-group">
            <label>Full Legal Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Secure Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Target Session Date</label>
            <input type="date" name="date" required>
        </div>
        <div class="form-group">
            <label>Acoustic System Requirements / Notes</label>
            <textarea name="notes" rows="4"></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit Session Verification</button>
    </form>
</section>
{% endblock %}
